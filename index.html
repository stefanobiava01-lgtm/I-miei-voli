async function sha256Hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
let pinUnlockedUntil = 0; // timestamp: once entered correctly, stays unlocked for a short session window
async function requirePin() {
  if (Date.now() < pinUnlockedUntil) return true;
  const entered = prompt('Inserisci il PIN per modificare i voli:');
  if (entered === null) return false;
  const hash = await sha256Hex(entered.trim());
  if (hash === PIN_HASH) {
    pinUnlockedUntil = Date.now() + 10 * 60 * 1000; // resta sbloccato 10 minuti
    return true;
  }
  alert('PIN errato.');
  return false;
}

function showConfirmModal(title, message, confirmLabel) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <div class="modal-title">${title}</div>
        <div class="modal-msg">${message}</div>
        <div class="modal-actions">
          <button class="btn-ghost" id="modal-cancel">Annulla</button>
          <button class="btn-danger" id="modal-confirm">${confirmLabel || 'Conferma'}</button>
        </div>
      </div>`;
    root.appendChild(overlay);
    const close = (result) => { overlay.remove(); resolve(result); };
    overlay.querySelector('#modal-cancel').onclick = () => close(false);
    overlay.querySelector('#modal-confirm').onclick = () => close(true);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(false); });
  });
}

function rowToFlight(row) {
  return {
    id: row.id, date: row.date, company: row.company,
    from: row.from_code, fromCity: row.from_city,
    to: row.to_code, toCity: row.to_city,
    aircraft: row.aircraft, tail: row.tail,
    km: row.km, price: row.price, note: row.note, extra: row.extra
  };
}

function flightToRow(f) {
  return {
    date: f.date, company: f.company,
    from_code: f.from, from_city: f.fromCity,
    to_code: f.to, to_city: f.toCity,
    aircraft: f.aircraft, tail: f.tail || null,
    km: f.km, price: f.price, note: f.note, extra: f.extra
  };
}

async function loadFlights() {
  if (!supabaseClient) {
    flights = SEED_FLIGHTS.slice();
    syncMode = 'offline';
    render();
    return;
  }
  try {
    const { data, error } = await supabaseClient.from('flights').select('*').order('date', { ascending: true });
    if (error) throw error;
    flights = (data || []).map(rowToFlight);
    syncMode = 'cloud';
  } catch (e) {
    console.error('Errore caricamento da Supabase', e);
    flights = SEED_FLIGHTS.slice();
    syncMode = 'offline';
  }
  render();
}

async function insertFlightRemote(flight) {
  if (!supabaseClient) throw new Error('offline');
  const { data, error } = await supabaseClient.from('flights').insert([flightToRow(flight)]).select();
  if (error) throw error;
  return rowToFlight(data[0]);
}

async function deleteFlightRemote(id) {
  if (!supabaseClient || !id) return;
  const { error } = await supabaseClient.from('flights').delete().eq('id', id);
  if (error) throw error;
}

async function updateFlightRemote(id, flight) {
  if (!supabaseClient) throw new Error('offline');
  const { data, error } = await supabaseClient.from('flights').update(flightToRow(flight)).eq('id', id).select();
  if (error) throw error;
  return rowToFlight(data[0]);
}

function airportInfo(code) {
  return AIRPORTS[code] || { city: code, country: '', lat: null, lon: null };
}

function fmtNum(n, decimals) {
  decimals = decimals || 0;
  return (n||0).toLocaleString('it-IT', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function isFlown(f) { return f.date <= TODAY_STR; }
function isFuture(f) { return f.date > TODAY_STR; }

// Apply globalFilters to a list. If excludeDim given, skip that dimension's check
// (so a chart can show its own full set of options while respecting the others).
function applyGlobalFilters(list, excludeDim) {
  return list.filter(f => {
    if (globalFilters.year && excludeDim !== 'year' && f.date.slice(0,4) !== globalFilters.year) return false;
    if (globalFilters.airport && excludeDim !== 'airport' && f.from !== globalFilters.airport && f.to !== globalFilters.airport) return false;
    if (globalFilters.company && excludeDim !== 'company' && f.company !== globalFilters.company) return false;
    if (globalFilters.aircraft && excludeDim !== 'aircraft' && f.aircraft !== globalFilters.aircraft) return false;
    return true;
  });
}

function hasActiveFilters() {
  return !!(globalFilters.year || globalFilters.airport || globalFilters.company || globalFilters.aircraft);
}

function computeStats(baseList) {
  const flownList = baseList.filter(isFlown);
  const futureList = baseList.filter(isFuture);

  const totalFlights = flownList.length;
  const totalKm = flownList.reduce((s,f) => s + (f.km || 0), 0);
  const avgSpeedKmh = 780;
  const taxiMinutesPerFlight = 25;
  const totalMinutes = flownList.reduce((s,f) => s + ((f.km||0)/avgSpeedKmh*60 + taxiMinutesPerFlight), 0);
  const totalHours = totalMinutes/60;

  const airportSet = new Set();
  const countrySet = new Set();
  flownList.forEach(f => {
    airportSet.add(f.from); airportSet.add(f.to);
    const ai = airportInfo(f.from), bi = airportInfo(f.to);
    if (ai.country) countrySet.add(ai.country);
    if (bi.country) countrySet.add(bi.country);
  });

  const earthCircumference = 40075;
  const timesAroundEarth = totalKm / earthCircumference;

  const dates = flownList.map(f=>f.date).sort();
  const firstYear = dates.length ? dates[0].slice(0,4) : '-';
  const lastYear = dates.length ? dates[dates.length-1].slice(0,4) : '-';

  const nextFlight = futureList.slice().sort((a,b)=>a.date.localeCompare(b.date))[0] || null;

  return {
    totalFlights, totalKm, totalHours, airportSet, countrySet,
    firstYear, lastYear, timesAroundEarth,
    upcomingCount: futureList.length, nextFlight
  };
}

function countBy(list, keyFn) {
  const counts = {};
  list.forEach(f => {
    const k = keyFn(f);
    if (!k) return;
    counts[k] = (counts[k]||0) + 1;
  });
  return counts;
}

function project(lat, lon, bbox, W, H, pad) {
  const x = pad + (lon - bbox.minLon) / (bbox.maxLon - bbox.minLon) * (W - 2*pad);
  const y = pad + (bbox.maxLat - lat) / (bbox.maxLat - bbox.minLat) * (H - 2*pad);
  return [x, y];
}

function initLeafletMap(mapFlights) {
  const mapEl = document.getElementById('leaflet-map');
  if (!mapEl || typeof L === 'undefined') return;
  if (window.__flightyMap) {
    try { window.__flightyMap.remove(); } catch(e) {}
    window.__flightyMap = null;
  }
  const usedCodes = new Set();
  mapFlights.forEach(f => { usedCodes.add(f.from); usedCodes.add(f.to); });
  const pts = [...usedCodes].map(c => ({ code: c, ...airportInfo(c) })).filter(a => a.lat && a.lon);
  if (!pts.length) {
    mapEl.innerHTML = '<div class="empty-note" style="padding-top:40px;">Nessuna rotta da mostrare con questi filtri.</div>';
    return;
  }

  const map = L.map(mapEl, { scrollWheelZoom: true, zoomControl: true, attributionControl: true });
  window.__flightyMap = map;

  const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri',
    maxZoom: 19
  });
  const satLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, pane: 'shadowPane'
  });
  const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    subdomains: 'abcd', maxZoom: 19
  });

  window.__flightyLayers = { satLayer, satLabels, darkLayer };
  if (mapStyle === 'satellite') { satLayer.addTo(map); satLabels.addTo(map); }
  else { darkLayer.addTo(map); }

  const routeSeen = {};
  mapFlights.forEach(f => {
    const a = airportInfo(f.from), b = airportInfo(f.to);
    if (!a.lat || !b.lat) return;
    const key = [f.from, f.to].sort().join('-');
    routeSeen[key] = (routeSeen[key] || 0) + 1;
  });
  const routeColor = mapStyle === 'satellite' ? '#FFD700' : '#4FD8C9';
  Object.keys(routeSeen).forEach(key => {
    const [c1, c2] = key.split('-');
    const a = airportInfo(c1), b = airportInfo(c2);
    const weight = routeSeen[key];
    L.polyline([[a.lat, a.lon], [b.lat, b.lon]], {
      color: routeColor,
      weight: Math.min(1.4 + weight * 0.8, 5),
      opacity: Math.min(0.55 + weight * 0.1, 0.95)
    }).addTo(map);
  });

  const bounds = [];
  pts.forEach(a => {
    bounds.push([a.lat, a.lon]);
    const isHome = HOME_AIRPORTS.includes(a.code);
    const count = mapFlights.filter(f => f.from === a.code || f.to === a.code).length;
    const marker = L.circleMarker([a.lat, a.lon], {
      radius: isHome ? 8 : 5.5,
      color: '#070B14',
      weight: 1.5,
      fillColor: isHome ? '#F0755A' : '#E8B463',
      fillOpacity: 1
    }).addTo(map);
    marker.bindPopup(`<b>${a.code}</b> · ${a.city}${a.country ? ', ' + a.country : ''}<br/>${count} vol${count === 1 ? 'o' : 'i'}`);
  });

  if (bounds.length === 1) map.setView(bounds[0], 6);
  else map.fitBounds(bounds, { padding: [36, 36] });

  setTimeout(() => { try { map.invalidateSize(); } catch(e) {} }, 80);
}

function renderRankList(counts, activeVal, dim, labelFn) {
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const max = entries[0] ? entries[0][1] : 1;
  const rows = entries.map((e,i) => `
    <div class="rank-row clickable ${activeVal===e[0]?'active':''}" data-dim="${dim}" data-val="${e[0].replace(/"/g,'&quot;')}">
      <div class="rank-idx">${i+1}</div>
      <div class="rank-name">${labelFn ? labelFn(e[0]) : e[0]}</div>
      <div class="rank-bar-track"><div class="rank-bar-fill" style="width:${(e[1]/max*100).toFixed(0)}%"></div></div>
      <div class="rank-val">${e[1]}</div>
    </div>`).join('') || '<div class="empty-note">Nessun dato</div>';
  return `<div class="rank-scroll">${rows}</div>`;
}

function applyQuickFilters(list) {
  let out = list;
  const now = new Date();
  if (currentFilter !== 'all') {
    const yearsAgo = { '1y': 1, '3y': 3 };
    if (currentFilter === 'thisyear') {
      out = out.filter(f => f.date.slice(0,4) === String(now.getFullYear()));
    } else if (currentFilter === 'work') {
      out = out.filter(f => (f.note||'').toUpperCase().includes('X LAVORO'));
    } else if (yearsAgo[currentFilter]) {
      const cutoff = new Date(now); cutoff.setFullYear(cutoff.getFullYear() - yearsAgo[currentFilter]);
      out = out.filter(f => new Date(f.date) >= cutoff);
    }
  }
  if (searchTerm.trim()) {
    const t = searchTerm.trim().toLowerCase();
    out = out.filter(f =>
      f.company.toLowerCase().includes(t) ||
      f.from.toLowerCase().includes(t) || f.to.toLowerCase().includes(t) ||
      (f.fromCity||'').toLowerCase().includes(t) || (f.toCity||'').toLowerCase().includes(t) ||
      (f.aircraft||'').toLowerCase().includes(t)
    );
  }
  return out;
}

  return `

        <div class="year-chart">${yearChart}</div>

        ${renderRankList(aircraftCounts, globalFilters.aircraft, 'aircraft', null)}

    </div>`;
}

function renderPass(f, idx) {
  const d = new Date(f.date + 'T00:00:00');
  const day = d.getDate();
  const month = MONTHS_IT[d.getMonth()];
  const year = d.getFullYear();
  const hours = (f.km||0)/780 + 25/60;
  const h = Math.floor(hours);
  const m = Math.round((hours-h)*60);
  const future = isFuture(f);
  return `
    <div class="pass${future?' pass-future':''}" data-idx="${idx}">
      <div class="pass-main">
        <div class="pass-route">
          <div class="pass-code">${f.from}</div>
          <div class="pass-arrow"><span class="ln"></span>✈<span class="ln"></span></div>
          <div class="pass-code">${f.to}</div>
        </div>
        <div class="pass-cities">${f.fromCity||''} → ${f.toCity||''}</div>
        <div class="pass-meta">
          <span><b>${f.company}</b></span>
          ${f.aircraft ? `<span>${f.aircraft}</span>` : ''}
          ${f.km ? `<span>${fmtNum(f.km)} km</span>` : ''}
          <span>${h}h ${m}m</span>
        </div>
        ${future ? `<div class="pass-tag pass-tag-future">In programma</div>` : (f.note ? `<div class="pass-tag">${f.note}</div>` : '')}
      </div>
      <div class="pass-stub">
        <div class="date-d">${day}</div>
        <div class="date-m">${month}</div>
        <div class="date-y">${year}</div>
      </div>
      <button class="pass-edit" data-edit="${idx}" title="Modifica volo">✎</button>
      <button class="pass-del" data-del="${idx}" title="Elimina volo">✕</button>
    </div>`;
}

function exportBackupXlsx() {
  if (typeof XLSX === 'undefined') { alert('Libreria di esportazione non disponibile.'); return; }
  const rows = flights.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(f => ({
    'Data': f.date,
    'Compagnia': f.company,
    'Da (IATA)': f.from,
    'Città partenza': f.fromCity || '',
    'A (IATA)': f.to,
    'Città arrivo': f.toCity || '',
    'Aereo': f.aircraft || '',
    'Km': f.km || '',
    'Prezzo (€)': f.price || '',
    'Note': f.note || ''
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Voli');
  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `backup_voli_${stamp}.xlsx`);
}

    : '<div class="empty-note">Nessun volo trovato con questi filtri.</div>';

  return `
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title"><span class="dot"></span>I tuoi voli (${list.length})</div>
        <div class="panel-head-actions">
          <button class="export-btn" id="export-backup" title="Scarica un file Excel con tutti i voli">⬇ Esporta backup</button>
          <button class="add-btn" id="toggle-add">+ Aggiungi volo</button>
        </div>
      </div>
      <div class="timeline-controls">
        <div class="chip ${currentFilter==='all'?'active':''}" data-filter="all">Tutti</div>
        <div class="chip ${currentFilter==='thisyear'?'active':''}" data-filter="thisyear">Quest'anno</div>
        <div class="chip ${currentFilter==='1y'?'active':''}" data-filter="1y">Ultimo anno</div>
        <div class="chip ${currentFilter==='3y'?'active':''}" data-filter="3y">Ultimi 3 anni</div>
        <div class="chip chip-work ${currentFilter==='work'?'active':''}" data-filter="work">✈ X LAVORO</div>
        <input class="search-input" id="search-box" placeholder="Cerca..." value="${searchTerm}"/>
      </div>
      <div class="add-form" id="add-form">
        <div class="form-title" id="form-title">Nuovo volo</div>
        <div class="form-grid">
          <div class="field"><label>Data</label><input type="date" id="f-date"/></div>
          <div class="field"><label>Compagnia</label><input type="text" id="f-company" placeholder="es. Ryanair" list="company-options"/></div>
          <div class="field"><label>Da (IATA)</label><input type="text" id="f-from" placeholder="es. BGY" maxlength="4" style="text-transform:uppercase" list="airport-options"/></div>
          <div class="field"><label>Città partenza</label><input type="text" id="f-fromcity" placeholder="es. Bergamo"/></div>
          <div class="field"><label>A (IATA)</label><input type="text" id="f-to" placeholder="es. VLC" maxlength="4" style="text-transform:uppercase" list="airport-options"/></div>
          <div class="field"><label>Città arrivo</label><input type="text" id="f-tocity" placeholder="es. Valencia"/></div>
          <div class="field"><label>Aereo</label><input type="text" id="f-aircraft" placeholder="es. B737-800" list="aircraft-options"/></div>
          <div class="field"><label>Distanza (km)</label><input type="number" id="f-km" placeholder="es. 1200"/></div>
          <div class="field"><label>Prezzo (€)</label><input type="number" step="0.01" id="f-price" placeholder="es. 24.99"/></div>
          <div class="field"><label>Note</label><input type="text" id="f-note" placeholder="opzionale"/></div>
        </div>
        <datalist id="airport-options">${airportDatalistOptions()}</datalist>
        <datalist id="company-options">${companyDatalistOptions()}</datalist>
        <datalist id="aircraft-options">${aircraftDatalistOptions()}</datalist>
        <div class="form-actions">
          <button class="btn-primary" id="save-flight">Salva volo</button>
          <button class="btn-ghost" id="cancel-add">Annulla</button>
          <span class="form-msg" id="form-msg"></span>
        </div>
        <div class="form-hint">Se la data è futura il volo viene registrato come "in programma" e passa automaticamente tra i voli volati quando la data arriva.</div>
      </div>
      <div class="pass-list" id="pass-list">${passesHtml}</div>
    </div>`;
}

function render() {
  const filteredForStats = applyGlobalFilters(getBaseFlights(), null);
  const stats = computeStats(filteredForStats);
  root.innerHTML = `
    <div class="bg-grid"></div>
    <div class="wrap">
      <div class="header">
        <div class="brand">
          <div>
            <div class="brand-title">✈️ I miei voli</div>
            <div class="brand-sub">Flight log personale · ${stats.firstYear}–${stats.lastYear}</div>
            <div class="sync-badge ${syncMode==='cloud'?'sync-ok':'sync-off'}">${syncMode==='cloud' ? '● Sincronizzato' : '○ Offline — dati non salvati'} · ${todayFormatted()}</div>
          </div>
        </div>
        <div class="header-right">
          <div class="num">${stats.totalFlights}</div>
          <div class="lbl">voli volati</div>
        </div>
      </div>
      ${renderFilterBar()}
      ${renderStatStrip(stats)}
      ${renderMapPanel(filteredForStats)}
      ${renderRankPanels()}
      ${renderTimeline()}
      <div class="footer-note">I dati restano salvati automaticamente su questo dispositivo — aggiungi un volo qui sopra ogni volta che voli. Clicca anno / aeroporto / compagnia / aereo per filtrare tutta la dashboard.</div>
    </div>`;
  bindEvents(filteredForStats);
}

function bindEvents(mapFlights) {
  // filter chips (timeline quick range)
  root.querySelectorAll('.chip[data-filter]').forEach(chip => {
    chip.addEventListener('click', () => {
      currentFilter = chip.getAttribute('data-filter');
      render();
    });
  });

  // cross-filter clicks (year bars, rank rows)
  root.querySelectorAll('[data-dim]').forEach(el => {
    el.addEventListener('click', () => {
      const dim = el.getAttribute('data-dim');
      const val = el.getAttribute('data-val');
      toggleFilter(dim, val);
    });
  });

  // clear filter chips
  root.querySelectorAll('.filter-chip[data-clear]').forEach(chip => {
    chip.addEventListener('click', () => {
      const dim = chip.getAttribute('data-clear');
      globalFilters[dim] = null;
      render();
    });
  });
  const clearAllBtn = root.querySelector('#clear-all-filters');
  if (clearAllBtn) clearAllBtn.addEventListener('click', clearAllFilters);

  // map style toggle
  root.querySelectorAll('.map-toggle button').forEach(btn => {
    btn.addEventListener('click', () => switchMapStyle(btn.getAttribute('data-style')));
  });

  // search
  const searchBox = root.querySelector('#search-box');
  if (searchBox) {
    searchBox.addEventListener('input', (e) => {
      searchTerm = e.target.value;
      const list = getFilteredFlights();
      const idxMap = list.map(f => flights.indexOf(f));
      const passList = root.querySelector('#pass-list');
      passList.innerHTML = list.length ? list.map((f,i)=>renderPass(f, idxMap[i])).join('') : '<div class="empty-note">Nessun volo trovato con questi filtri.</div>';
      bindPassDelete();
      bindPassEdit();
      const countTitles = root.querySelectorAll('.panel-title');
      countTitles.forEach(t => { if (t.textContent.includes('I tuoi voli')) t.innerHTML = `<span class="dot"></span>I tuoi voli (${list.length})`; });
    });
  }

  // toggle add form (new flight)
  const toggleBtn = root.querySelector('#toggle-add');
  const exportBtn = root.querySelector('#export-backup');
  if (exportBtn) exportBtn.addEventListener('click', exportBackupXlsx);
  const addForm = root.querySelector('#add-form');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', async () => {
      if (!addForm.classList.contains('open')) {
        const ok = await requirePin();
        if (!ok) return;
        editingFlightId = null;
        resetFormFields();
        root.querySelector('#save-flight').textContent = 'Salva volo';
        root.querySelector('#form-title').textContent = 'Nuovo volo';
        const dEl = root.querySelector('#f-date');
        dEl.value = new Date().toISOString().slice(0,10);
        addForm.classList.add('open');
      } else {
        addForm.classList.remove('open');
      }
    });
  }
  const cancelBtn = root.querySelector('#cancel-add');
  if (cancelBtn) cancelBtn.addEventListener('click', () => { addForm.classList.remove('open'); editingFlightId = null; });

  // autocompila la città quando riconosce un codice IATA noto
  ['f-from','f-to'].forEach(fieldId => {
    const input = root.querySelector('#'+fieldId);
    const cityId = fieldId === 'f-from' ? 'f-fromcity' : 'f-tocity';
    if (!input) return;
    input.addEventListener('blur', () => {
      const code = input.value.trim().toUpperCase();
      const cityInput = root.querySelector('#'+cityId);
      if (AIRPORTS[code] && cityInput && !cityInput.value.trim()) {
        cityInput.value = AIRPORTS[code].city;
      }
    });
  });

  // save flight (insert or update depending on editingFlightId)
  const saveBtn = root.querySelector('#save-flight');
  if (saveBtn) {
    saveBtn.addEventListener('click', async () => {
      const date = root.querySelector('#f-date').value;
      const company = root.querySelector('#f-company').value.trim();
      const from = root.querySelector('#f-from').value.trim().toUpperCase();
      const fromCity = root.querySelector('#f-fromcity').value.trim();
      const to = root.querySelector('#f-to').value.trim().toUpperCase();
      const toCity = root.querySelector('#f-tocity').value.trim();
      const aircraft = root.querySelector('#f-aircraft').value.trim();
      const kmVal = root.querySelector('#f-km').value;
      const priceVal = root.querySelector('#f-price').value;
      const note = root.querySelector('#f-note').value.trim();
      const msg = root.querySelector('#form-msg');

      if (!date || !company || !from || !to) {
        msg.textContent = 'Compila almeno data, compagnia, da e a.';
        msg.style.color = '#F0755A';
        return;
      }

      if (!AIRPORTS[from]) AIRPORTS[from] = { city: fromCity || from, country: '', lat: null, lon: null };
      if (!AIRPORTS[to]) AIRPORTS[to] = { city: toCity || to, country: '', lat: null, lon: null };
      if (fromCity && AIRPORTS[from]) AIRPORTS[from].city = fromCity;
      if (toCity && AIRPORTS[to]) AIRPORTS[to].city = toCity;

      // preserve "extra" (legacy reimbursement field) untouched when editing — no UI for it, don't wipe it
      const existingExtra = editingFlightId ? (flights.find(f => f.id === editingFlightId) || {}).extra : null;

      const flightData = {
        date, company, from, fromCity: fromCity || AIRPORTS[from].city, to, toCity: toCity || AIRPORTS[to].city,
        aircraft: aircraft || null, tail: null,
        km: kmVal ? parseFloat(kmVal) : null,
        price: priceVal ? parseFloat(priceVal) : null,
        note: note || null, extra: existingExtra ?? null
      };

      if (editingFlightId) {
        try {
          const updated = await updateFlightRemote(editingFlightId, flightData);
          const idx = flights.findIndex(f => f.id === editingFlightId);
          if (idx >= 0) flights[idx] = updated;
          msg.textContent = 'Volo aggiornato ✓ (sincronizzato)';
          msg.style.color = '#4FD8C9';
        } catch (err) {
          console.error('Errore aggiornamento remoto', err);
          const idx = flights.findIndex(f => f.id === editingFlightId);
          if (idx >= 0) flights[idx] = { ...flights[idx], ...flightData };
          msg.textContent = 'Aggiornato solo su questo dispositivo — controlla la connessione.';
          msg.style.color = '#F0755A';
        }
        editingFlightId = null;
      } else {
        try {
          const saved = await insertFlightRemote(flightData);
          flights.push(saved);
          msg.textContent = date > TODAY_STR ? 'Volo in programma salvato ✓ (sincronizzato)' : 'Volo salvato ✓ (sincronizzato)';
          msg.style.color = '#4FD8C9';
        } catch (err) {
          console.error('Errore salvataggio remoto', err);
          flights.push(flightData);
          msg.textContent = 'Salvato solo su questo dispositivo — controlla la connessione.';
          msg.style.color = '#F0755A';
        }
      }
      setTimeout(() => render(), 600);
    });
  }

  bindPassDelete();
  bindPassEdit();
  setTimeout(() => initLeafletMap(mapFlights), 0);
}

function resetFormFields() {
  ['f-date','f-company','f-from','f-fromcity','f-to','f-tocity','f-aircraft','f-km','f-price','f-note'].forEach(id => {
    const el = root.querySelector('#'+id);
    if (el) el.value = '';
  });
  const msg = root.querySelector('#form-msg');
  if (msg) msg.textContent = '';
}

async function openEditForm(idx) {
  const ok = await requirePin();
  if (!ok) return;
  const f = flights[idx];
  if (!f) return;
  editingFlightId = f.id;
  const addForm = root.querySelector('#add-form');
  root.querySelector('#f-date').value = f.date;
  root.querySelector('#f-company').value = f.company || '';
  root.querySelector('#f-from').value = f.from || '';
  root.querySelector('#f-fromcity').value = f.fromCity || '';
  root.querySelector('#f-to').value = f.to || '';
  root.querySelector('#f-tocity').value = f.toCity || '';
  root.querySelector('#f-aircraft').value = f.aircraft || '';
  root.querySelector('#f-km').value = f.km || '';
  root.querySelector('#f-price').value = f.price || '';
  root.querySelector('#f-note').value = f.note || '';
  root.querySelector('#form-msg').textContent = '';
  root.querySelector('#save-flight').textContent = 'Salva modifiche';
  root.querySelector('#form-title').textContent = 'Modifica volo';
  addForm.classList.add('open');
  addForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function bindPassEdit() {
  root.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.getAttribute('data-edit'), 10);
      openEditForm(idx);
    });
  });
}

function bindPassDelete() {
  root.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const ok = await requirePin();
      if (!ok) return;
      const idx = parseInt(btn.getAttribute('data-del'), 10);
      const target = flights[idx];
      if (!target) return;
      const confirmed = await showConfirmModal(
        'Eliminare questo volo?',
        `${target.from} → ${target.to} · ${target.date.split('-').reverse().join('/')}<br/>Questa azione non può essere annullata.`,
        'Elimina'
      );
      if (!confirmed) return;
      try {
        await deleteFlightRemote(target.id);
      } catch (err) {
        console.error('Errore eliminazione remota', err);
        alert('Non sono riuscito a eliminarlo dal database condiviso (offline?). Riprova quando sei online.');
        return;
      }
      flights.splice(idx, 1);
      render();
    });
  });
}

loadFlights();


})();
</script>
