<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<div id="flighty-root"></div>
<style>
  #flighty-root {
    --bg: #070B14;
    --bg-panel: #0E1524;
    --bg-panel-2: #121A2C;
    --line: rgba(148, 168, 210, 0.14);
    --gold: #E8B463;
    --teal: #4FD8C9;
    --coral: #F0755A;
    --text: #EAF0FA;
    --text-dim: #8B99B8;
    --text-faint: #55628A;
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
  }
  #flighty-root * { box-sizing: border-box; }
  #flighty-root .mono { font-family: 'IBM Plex Mono', monospace; }
  #flighty-root .display { font-family: 'Space Grotesk', sans-serif; }

  #flighty-root .bg-grid {
    position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(79,216,201,.10), transparent),
      radial-gradient(ellipse 60% 40% at 90% 10%, rgba(232,180,99,.06), transparent);
  }

  #flighty-root .wrap { position: relative; max-width: 1180px; margin: 0 auto; padding: 28px 24px 60px; }

  #flighty-root .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 26px; flex-wrap: wrap; gap: 14px; }
  #flighty-root .brand { display: flex; align-items: center; gap: 10px; }
  #flighty-root .brand-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  #flighty-root .brand-sub { font-size: 11.5px; color: var(--text-faint); letter-spacing: .12em; text-transform: uppercase; margin-top: 2px; }
  #flighty-root .header-right { text-align: right; }
  #flighty-root .header-right .num { font-size: 30px; font-weight: 700; color: var(--gold); font-family: 'Space Grotesk', sans-serif; line-height:1; }
  #flighty-root .header-right .lbl { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .1em; margin-top:4px; }
  #flighty-root .user-badge { font-size: 10px; color: var(--text-faint); margin-top: 6px; }
  #flighty-root .logout-link { color: var(--coral); cursor: pointer; text-decoration: underline; }
  #flighty-root .logout-link:hover { color: #ff9382; }

  #flighty-root .login-wrap { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; }
  #flighty-root .login-box { text-align: center; max-width: 340px; }
  #flighty-root .login-title { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
  #flighty-root .login-sub { font-size: 13.5px; color: var(--text-dim); margin-bottom: 28px; }
  #flighty-root .google-btn { display: inline-flex; align-items: center; gap: 10px; background: #fff; color: #1f1f1f; border: none; padding: 12px 22px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: transform .1s, box-shadow .15s; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #flighty-root .google-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  #flighty-root .google-btn:disabled { opacity: .7; cursor: default; transform: none; }
  #flighty-root .login-note { font-size: 11.5px; color: var(--text-faint); margin-top: 22px; line-height: 1.5; }
  #flighty-root .sync-badge { font-size: 10.5px; margin-top: 6px; font-weight: 600; letter-spacing: .03em; }
  #flighty-root .sync-badge.sync-ok { color: var(--teal); }
  #flighty-root .sync-badge.sync-off { color: var(--coral); }

  #flighty-root .stat-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 22px; }
  #flighty-root .stat-cell { background: var(--bg-panel); padding: 16px 16px; position: relative; text-align: center; }
  #flighty-root .stat-cell .v { font-size: 24px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.01em; }
  #flighty-root .stat-cell .l { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .09em; margin-top: 4px; }
  #flighty-root .stat-sub { text-transform: none; letter-spacing: normal; opacity: .75; }
  #flighty-root .stat-cell .accent-teal { color: var(--teal); }
  #flighty-root .stat-cell .accent-gold { color: var(--gold); }
  #flighty-root .stat-cell .accent-coral { color: var(--coral); }
  #flighty-root .stat-cell.upcoming { background: linear-gradient(180deg, rgba(240,117,90,.08), var(--bg-panel)); border-left: 2px solid var(--coral); }
  #flighty-root .upcoming-next { font-size: 9.5px; color: var(--text-faint); margin-top: 5px; line-height: 1.3; }

  #flighty-root .filter-bar { display:flex; align-items:center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; padding: 10px 14px; background: rgba(79,216,201,.06); border: 1px solid rgba(79,216,201,.25); border-radius: 10px; }
  #flighty-root .filter-bar-label { font-size: 11.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .06em; }
  #flighty-root .filter-chip { display:inline-flex; align-items:center; gap: 6px; background: var(--teal); color: #061214; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 14px; cursor: pointer; }
  #flighty-root .filter-chip b { font-weight: 700; }
  #flighty-root .filter-clear-all { margin-left: auto; font-size: 11.5px; color: var(--text-faint); text-decoration: underline; cursor: pointer; }
  #flighty-root .filter-clear-all:hover { color: var(--text); }

  #flighty-root .rank-row.clickable { cursor: pointer; border-radius: 6px; transition: background .12s; }
  #flighty-root .rank-scroll { max-height: 260px; overflow-y: auto; padding-right: 4px; }
  #flighty-root .rank-scroll::-webkit-scrollbar { width: 6px; }
  #flighty-root .rank-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  #flighty-root .rank-row.clickable:hover { background: rgba(255,255,255,.03); }
  #flighty-root .rank-row.clickable.active { background: rgba(79,216,201,.1); }
  #flighty-root .rank-row.clickable.active .rank-name { color: var(--teal); font-weight: 600; }

  #flighty-root .map-toggle { display:flex; gap: 6px; }
  #flighty-root .map-toggle button { background: var(--bg-panel-2); border: 1px solid var(--line); color: var(--text-dim); font-size: 11.5px; padding: 6px 11px; border-radius: 16px; cursor: pointer; transition: all .15s; }
  #flighty-root .map-toggle button:hover { color: var(--text); }
  #flighty-root .map-toggle button.active { background: var(--gold); border-color: var(--gold); color: #1a1204; font-weight: 600; }

  #flighty-root .pass-future { border-color: rgba(240,117,90,.4); background: linear-gradient(180deg, rgba(240,117,90,.05), var(--bg-panel-2)); }
  #flighty-root .pass-tag-future { background: rgba(240,117,90,.22); color: var(--coral); font-weight: 600; }
  #flighty-root .form-hint { font-size: 11px; color: var(--text-faint); margin-top: 10px; }

  #flighty-root .panel { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
  #flighty-root .panel-head { display:flex; justify-content: space-between; align-items:center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px;}
  #flighty-root .panel-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--text-dim); display:flex; align-items:center; gap:8px; }
  #flighty-root .panel-title .dot { width:6px; height:6px; border-radius:50%; background: var(--teal); box-shadow: 0 0 8px var(--teal); }

  #flighty-root .map-box { width: 100%; height: 480px; border-radius: 10px; overflow: hidden; background: #0A0F1C; position: relative; }
  #flighty-root #leaflet-map { width: 100%; height: 100%; }
  #flighty-root .map-legend { display:flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-faint); }
  #flighty-root .map-legend span { display:inline-flex; align-items:center; gap:6px; }
  #flighty-root .map-legend .sw { width: 8px; height: 8px; border-radius: 50%; display:inline-block; }
  /* Leaflet dark theme overrides */
  #flighty-root .leaflet-container { background: #0A0F1C; font-family: 'Inter', sans-serif; }
  #flighty-root .leaflet-control-zoom a { background: #121A2C !important; color: #EAF0FA !important; border-color: rgba(148,168,210,0.14) !important; }
  #flighty-root .leaflet-control-zoom a:hover { background: #1a2338 !important; }
  #flighty-root .leaflet-popup-content-wrapper { background: #0E1524 !important; color: #EAF0FA !important; border: 1px solid rgba(148,168,210,0.14); border-radius: 8px !important; }
  #flighty-root .leaflet-popup-tip { background: #0E1524 !important; }
  #flighty-root .leaflet-popup-content { font-size: 12.5px !important; margin: 10px 12px !important; }
  #flighty-root .leaflet-control-attribution { background: rgba(10,15,28,0.75) !important; color: #55628A !important; font-size: 9.5px !important; }
  #flighty-root .leaflet-control-attribution a { color: #8B99B8 !important; }

  #flighty-root .cols { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 20px; }
  @media (max-width: 860px) { #flighty-root .cols { grid-template-columns: 1fr; } }

  #flighty-root .rank-row { display:flex; align-items:center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  #flighty-root .rank-row:last-child { border-bottom: none; }
  #flighty-root .rank-idx { width: 18px; font-size: 11px; color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; flex-shrink:0; }
  #flighty-root .rank-name { flex: 1; font-size: 13px; min-width: 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #flighty-root .rank-bar-track { width: 80px; height: 5px; background: rgba(255,255,255,.06); border-radius: 3px; overflow: hidden; flex-shrink:0; }
  #flighty-root .rank-bar-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--gold)); border-radius: 3px; }
  #flighty-root .rank-val { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); width: 26px; text-align: right; flex-shrink:0; }
  #flighty-root .rank-val-count { width: 28px; flex-shrink:0; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); overflow: hidden; }
  #flighty-root .rank-val-km { width: 78px; flex-shrink:0; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #flighty-root .rank-val-primary { color: var(--teal); font-weight: 700; }
  #flighty-root .sort-toggle { display:flex; gap: 4px; }
  #flighty-root .sort-btn { background: var(--bg-panel-2); border: 1px solid var(--line); color: var(--text-faint); font-size: 10.5px; padding: 4px 9px; border-radius: 12px; cursor: pointer; transition: all .15s; }
  #flighty-root .sort-btn:hover { color: var(--text); }
  #flighty-root .sort-btn.active { background: var(--teal); border-color: var(--teal); color: #061214; font-weight: 600; }


  #flighty-root .timeline-controls { display:flex; gap:8px; margin-bottom: 14px; flex-wrap: wrap; align-items:center; }
  #flighty-root .chip { padding: 6px 12px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg-panel-2); font-size: 12px; color: var(--text-dim); cursor: pointer; transition: all .15s; }
  #flighty-root .chip:hover { border-color: var(--teal); color: var(--text); }
  #flighty-root .chip.active { background: var(--teal); border-color: var(--teal); color: #061214; font-weight: 600; }
  #flighty-root .chip-work { border-color: rgba(240,117,90,.4); color: var(--coral); }
  #flighty-root .chip-work:hover { border-color: var(--coral); color: var(--coral); }
  #flighty-root .chip-work.active { background: var(--coral); border-color: var(--coral); color: #2a0f08; font-weight: 600; }
  #flighty-root .search-input { margin-left: auto; background: var(--bg-panel-2); border: 1px solid var(--line); color: var(--text); padding: 7px 12px; border-radius: 20px; font-size: 12px; width: 160px; }
  #flighty-root .search-input:focus { outline:none; border-color: var(--teal); }

  #flighty-root .pass-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; max-height: 720px; overflow-y: auto; padding-right: 6px; align-content: start; }
  #flighty-root .pass-list::-webkit-scrollbar { width: 6px; }
  #flighty-root .pass-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  #flighty-root .modal-overlay { position: absolute; inset: 0; background: rgba(3,6,12,.72); display:flex; align-items:center; justify-content:center; z-index: 1000; border-radius: 14px; }
  #flighty-root .modal-box { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; max-width: 320px; width: 88%; text-align:center; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  #flighty-root .modal-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  #flighty-root .modal-msg { font-size: 13px; color: var(--text-dim); margin-bottom: 18px; line-height: 1.5; }
  #flighty-root .modal-actions { display:flex; gap: 10px; justify-content:center; }
  #flighty-root .btn-danger { background: var(--coral); color: #2a0f08; border:none; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor:pointer; }

  #flighty-root .pass { display: grid; grid-template-columns: 1fr auto; background: var(--bg-panel-2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; position: relative; height: 176px; transition: border-color .15s; }
  #flighty-root .pass:hover { border-color: rgba(79,216,201,.35); }
  #flighty-root .pass-main { padding: 14px 40px 14px 14px; display: flex; flex-direction: column; gap: 7px; min-width: 0; overflow: hidden; }
  #flighty-root .pass-line-fixed { display:flex; gap: 8px 10px; font-size: 11px; color: var(--text-dim); flex-wrap: wrap; align-items: center; }
  #flighty-root .pass-line-fixed b { color: var(--text); font-weight: 500; }
  #flighty-root .pass-airline { display:flex; align-items:center; }
  #flighty-root .pass-line-extra { display:flex; gap: 6px 8px; align-items:flex-start; flex-wrap: wrap; min-height: 18px; max-height: 48px; overflow: hidden; row-gap: 5px; }
  #flighty-root .pass-price { font-size: 12px; font-weight: 700; color: var(--teal); }
  #flighty-root .pass-tag { font-size: 9.5px; padding: 2px 7px; border-radius: 10px; background: rgba(240,117,90,.15); color: var(--coral); display:inline-block; width: fit-content; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #flighty-root .pass-tail { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; padding: 2px 7px; border-radius: 4px; background: rgba(148,168,210,.1); border: 1px solid var(--line); color: var(--text-dim); letter-spacing: .03em; white-space: nowrap; }
  #flighty-root .pass-tail-repeat { background: rgba(255,213,79,.22); border-color: rgba(255,213,79,.5); color: #E8C468; cursor: pointer; font-weight: 600; }
  #flighty-root .pass-tail-repeat:hover { background: rgba(255,213,79,.35); }
  #flighty-root .modal-box-wide { max-width: 380px; }
  #flighty-root .modal-msg-list { text-align: left; max-height: 260px; overflow-y: auto; }
  #flighty-root .tail-flight-list { display: flex; flex-direction: column; }
  #flighty-root .tail-flight-row { display:flex; align-items:center; justify-content:space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  #flighty-root .tail-flight-row:last-child { border-bottom: none; }
  #flighty-root .tail-flight-date { font-family: 'IBM Plex Mono', monospace; color: var(--text-dim); flex-shrink: 0; font-size: 11.5px; }
  #flighty-root .tail-flight-route { font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
  #flighty-root .tail-flight-company { color: var(--text-faint); font-size: 11px; flex-shrink: 0; }
  #flighty-root .pass-del { position:absolute; top:6px; right:6px; background:none; border:none; color: var(--text-faint); cursor:pointer; font-size: 14px; padding: 2px 6px; border-radius:4px; line-height:1; z-index: 2; }
  #flighty-root .pass-del:hover { color: var(--coral); background: rgba(240,117,90,.1); }
  #flighty-root .pass-edit { position:absolute; top:6px; right:30px; background:none; border:none; color: var(--text-faint); cursor:pointer; font-size: 13px; padding: 2px 6px; border-radius:4px; line-height:1; z-index: 2; }
  #flighty-root .pass-edit:hover { color: var(--teal); background: rgba(79,216,201,.1); }
  #flighty-root .pass-route { display:flex; align-items:center; gap: 10px; }
  #flighty-root .pass-code { font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: .02em; flex-shrink:0; }
  #flighty-root .pass-arrow { color: var(--teal); font-size: 12px; flex:1; display:flex; align-items:center; gap:6px; min-width: 20px;}
  #flighty-root .pass-arrow .ln { flex:1; height:1px; background: repeating-linear-gradient(90deg, var(--text-faint) 0 4px, transparent 4px 8px); min-width: 6px;}
  #flighty-root .flight-duration { font-size: 10px; color: var(--text-faint); white-space: nowrap; flex-shrink: 0; }
  #flighty-root .pass-cities { font-size: 11.5px; color: var(--text-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #flighty-root .pass-stub { width: 82px; border-left: 1px dashed var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 10px 6px; background: rgba(255,255,255,.015); position: relative; flex-shrink:0; }
  #flighty-root .pass-stub .date-d { font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700; color: var(--gold); line-height:1; }
  #flighty-root .pass-stub .date-m { font-size: 9.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }
  #flighty-root .pass-stub .date-y { font-size: 9px; color: var(--text-faint); margin-top: 1px; }
  #flighty-root .pass-stub::before, #flighty-root .pass-stub::after { content:''; position:absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); left: -6px; }
  #flighty-root .pass-stub::before { top: -6px; }
  #flighty-root .pass-stub::after { bottom: -6px; }

  #flighty-root .empty-note { text-align:center; color: var(--text-faint); font-size: 12.5px; padding: 20px 0; }

  #flighty-root .add-btn { display:flex; align-items:center; gap:8px; background: var(--teal); color: #061214; border:none; padding: 10px 16px; border-radius: 9px; font-weight: 600; font-size: 13px; cursor:pointer; transition: transform .1s; }
  #flighty-root .add-btn:hover { transform: translateY(-1px); }
  #flighty-root .panel-head-actions { display:flex; gap: 8px; flex-wrap: wrap; }
  #flighty-root .export-btn { display:flex; align-items:center; gap:6px; background: transparent; color: var(--text-dim); border: 1px solid var(--line); padding: 10px 14px; border-radius: 9px; font-weight: 600; font-size: 12.5px; cursor:pointer; transition: all .15s; }
  #flighty-root .export-btn:hover { color: var(--text); border-color: var(--teal); }
  #flighty-root .add-form { display: none; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
  #flighty-root .add-form.open { display: block; }
  #flighty-root .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; }
  #flighty-root .form-title { font-size: 13px; font-weight: 700; color: var(--teal); margin-bottom: 12px; text-transform: uppercase; letter-spacing: .06em; }
  #flighty-root .field label { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .07em; display:block; margin-bottom: 5px; }
  #flighty-root .field input, #flighty-root .field select { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--text); padding: 9px 10px; border-radius: 7px; font-size: 13px; font-family: inherit; }
  #flighty-root .field input:focus, #flighty-root .field select:focus { outline: none; border-color: var(--teal); }
  #flighty-root .form-actions { display:flex; gap: 10px; margin-top: 14px; align-items: center; }
  #flighty-root .btn-primary { background: var(--gold); color: #1a1204; border:none; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor:pointer; }
  #flighty-root .btn-ghost { background: transparent; color: var(--text-faint); border: 1px solid var(--line); padding: 10px 16px; border-radius: 8px; font-size: 13px; cursor:pointer; }
  #flighty-root .form-msg { font-size: 12px; color: var(--teal); margin-left: 6px; }

  #flighty-root .footer-note { text-align:center; font-size: 11px; color: var(--text-faint); margin-top: 24px; }
  #flighty-root .airline-logo-img { vertical-align: middle; border-radius: 3px; background: #fff; padding: 1px 3px; margin-right: 2px; }
  #flighty-root .airline-emoji { font-size: 13px; margin-right: 3px; }

async function initAuth() {
  if (!supabaseClient) {
    flights = SEED_FLIGHTS.slice();
    syncMode = 'offline';
    render();
    return;
  }
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    currentUser = session.user;
    loadFlights();
  } else {
    renderLoginScreen();
  }
  supabaseClient.auth.onAuthStateChange((event, newSession) => {
    if (event === 'SIGNED_IN' && newSession) {
      currentUser = newSession.user;
      loadFlights();
    } else if (event === 'SIGNED_OUT') {
      currentUser = null;
      renderLoginScreen();
    }
  });
}

async function logout() {
  if (supabaseClient) await supabaseClient.auth.signOut();
}

async function loadFlights() {
  if (!supabaseClient) {
    flights = SEED_FLIGHTS.slice();
    syncMode = 'offline';
    render();
    return;
  }
  try {
    const { data, error } = await supabaseClient.from('flights').select('*').order('date', { ascending: true });
    if (error) throw error;
    flights = (data || []).map(rowToFlight);
    syncMode = 'cloud';
  } catch (e) {
    console.error('Errore caricamento da Supabase', e);
    flights = SEED_FLIGHTS.slice();
    syncMode = 'offline';
  }
  render();
  resolveUnknownAirports().then(changed => { if (changed) render(); });
  resolveUnknownAirlines().then(changed => { if (changed) render(); });
}

  if (error) throw error;
  return rowToFlight(data[0]);
}

async function deleteFlightRemote(id) {

  const { error } = await supabaseClient.from('flights').delete().eq('id', id);

async function updateFlightRemote(id, flight) {
  if (!supabaseClient) throw new Error('offline');

  return rowToFlight(data[0]);
}

    else if (ch === ',' && !inQuotes) { result.push(cur); cur = ''; }
    else cur += ch;
  }
  result.push(cur);
  return result;

    .then(text => {
      const db = {};
      text.split('\n').forEach(line => {
        if (!line.trim()) return;
        const f = parseCsvLine(line);
        const iata = (f[4] || '').replace(/"/g, '').trim();
        const lat = parseFloat(f[6]), lon = parseFloat(f[7]);
        if (iata && iata.length === 3 && iata !== '\\N' && !isNaN(lat) && !isNaN(lon)) {
          db[iata] = {
            city: (f[2] || '').replace(/"/g, '').trim(),
            country: (f[3] || '').replace(/"/g, '').trim(),
            lat, lon
          };
        }
      });
      return db;
    })
    .catch(err => { console.error('Errore caricamento database aeroporti mondiale', err); return {}; });
  return openFlightsDbPromise;
}
async function resolveUnknownAirports() {
  const codes = new Set();
  flights.forEach(f => { codes.add(f.from); codes.add(f.to); });
  const missing = [...codes].filter(c => c && (!AIRPORTS[c] || !AIRPORTS[c].lat));
  if (!missing.length) return false;
  const db = await ensureAirportsDB();
  let changed = false;
  missing.forEach(code => {
    if (db[code]) {
      AIRPORTS[code] = {
        city: (AIRPORTS[code] && AIRPORTS[code].city) || db[code].city,
        country: db[code].country,
        lat: db[code].lat,
        lon: db[code].lon
      };
      changed = true;
    }
  });
  return changed;
}

// --- Ricerca compagnie aeree sconosciute in un database mondiale (OpenFlights) ---
// Stesso principio degli aeroporti: se aggiungi una compagnia non tra quelle già note,
// cerca automaticamente il suo codice IATA per mostrare il logo reale invece dell'icona generica.
let openAirlinesDbPromise = null;
function ensureAirlinesDB() {
  if (openAirlinesDbPromise) return openAirlinesDbPromise;
  openAirlinesDbPromise = fetch('https://raw.githubusercontent.com/jpatokal/openflights/master/data/airlines.dat')
    .then(r => r.text())
    .then(text => {
      const db = {}; // nome compagnia (minuscolo) -> codice IATA
      text.split('\n').forEach(line => {
        if (!line.trim()) return;
        const f = parseCsvLine(line);
        const name = (f[1] || '').replace(/"/g, '').trim();
        const iata = (f[3] || '').replace(/"/g, '').trim();
        if (name && iata && iata.length === 2 && iata !== '\\N' && iata !== '-') {
          db[name.toLowerCase()] = iata;
        }
      });
      return db;
    })
    .catch(err => { console.error('Errore caricamento database compagnie aeree mondiale', err); return {}; });
  return openAirlinesDbPromise;
}
async function resolveAirlineCode(companyName) {
  if (!companyName || AIRLINE_IATA[companyName]) return AIRLINE_IATA[companyName] || null;
  const db = await ensureAirlinesDB();
  const key = companyName.toLowerCase().trim();
  if (db[key]) { AIRLINE_IATA[companyName] = db[key]; return db[key]; }
  // ricerca approssimata: es. "Ryanair" trova anche "Ryanair DAC" / "Ryanair UK"
  const match = Object.keys(db).find(n => n.startsWith(key) || key.startsWith(n));
  if (match) { AIRLINE_IATA[companyName] = db[match]; return db[match]; }
  return null;
}
async function resolveUnknownAirlines() {
  const names = new Set(flights.map(f => f.company).filter(Boolean));
  const missing = [...names].filter(n => !AIRLINE_IATA[n]);
  if (!missing.length) return false;
  const results = await Promise.all(missing.map(n => resolveAirlineCode(n)));
  return results.some(r => r);
}

function fmtNum(n, decimals) {
  decimals = decimals || 0;
  return (n||0).toLocaleString('it-IT', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function isFlown(f) { return f.date <= TODAY_STR; }
function isFuture(f) { return f.date > TODAY_STR; }

// Apply globalFilters to a list. If excludeDim given, skip that dimension's check
// (so a chart can show its own full set of options while respecting the others).
function applyGlobalFilters(list, excludeDim) {
  return list.filter(f => {
    if (globalFilters.year && excludeDim !== 'year' && f.date.slice(0,4) !== globalFilters.year) return false;
    if (globalFilters.airport && excludeDim !== 'airport' && f.from !== globalFilters.airport && f.to !== globalFilters.airport) return false;
    if (globalFilters.company && excludeDim !== 'company' && f.company !== globalFilters.company) return false;
    if (globalFilters.aircraft && excludeDim !== 'aircraft' && f.aircraft !== globalFilters.aircraft) return false;
    return true;
  });
}

function hasActiveFilters() {
  return !!(globalFilters.year || globalFilters.airport || globalFilters.company || globalFilters.aircraft);
}

function toggleFilter(dim, value) {
  globalFilters[dim] = (globalFilters[dim] === value) ? null : value;
  render();
}

function clearAllFilters() {
  globalFilters = { year: null, airport: null, company: null, aircraft: null };
  render();
}

function computeStats(baseList) {
  const flownList = baseList.filter(isFlown);
  const futureList = baseList.filter(isFuture);

  const totalFlights = flownList.length;
  const totalKm = flownList.reduce((s,f) => s + (f.km || 0), 0);
  const avgSpeedKmh = 780;
  const taxiMinutesPerFlight = 25;
  const totalMinutes = flownList.reduce((s,f) => s + ((f.km||0)/avgSpeedKmh*60 + taxiMinutesPerFlight), 0);
  const totalHours = totalMinutes/60;

  const airportSet = new Set();
  const countrySet = new Set();
  const companySet = new Set();
  flownList.forEach(f => {
    airportSet.add(f.from); airportSet.add(f.to);
    const ai = airportInfo(f.from), bi = airportInfo(f.to);
    if (ai.country) countrySet.add(ai.country);
    if (bi.country) countrySet.add(bi.country);
    if (f.company) companySet.add(f.company);
  });

  const earthCircumference = 40075;
  const timesAroundEarth = totalKm / earthCircumference;

  const dates = flownList.map(f=>f.date).sort();
  const firstYear = dates.length ? dates[0].slice(0,4) : '-';
  const lastYear = dates.length ? dates[dates.length-1].slice(0,4) : '-';

  const nextFlight = futureList.slice().sort((a,b)=>a.date.localeCompare(b.date))[0] || null;

  return {
    totalFlights, totalKm, totalHours, airportSet, countrySet, companySet,
    firstYear, lastYear, timesAroundEarth,
    upcomingCount: futureList.length, nextFlight
  };
}

function countBy(list, keyFn) {
  const counts = {};
  list.forEach(f => {
    const k = keyFn(f);
    if (!k) return;
    counts[k] = (counts[k]||0) + 1;
  });
  return counts;
}

// Conta quante volte compare ogni tail number tra TUTTI i voli (non solo quelli filtrati),
// così un aereo "ricorrente" resta evidenziato indipendentemente dai filtri attivi.
function getTailCounts() {
  return countBy(flights, f => f.tail);
}

function project(lat, lon, bbox, W, H, pad) {
  const x = pad + (lon - bbox.minLon) / (bbox.maxLon - bbox.minLon) * (W - 2*pad);
  const y = pad + (bbox.maxLat - lat) / (bbox.maxLat - bbox.minLat) * (H - 2*pad);
  return [x, y];
}

function initLeafletMap(mapFlights) {
  const mapEl = document.getElementById('leaflet-map');
  if (!mapEl || typeof L === 'undefined') return;
  if (window.__flightyMap) {
    try { window.__flightyMap.remove(); } catch(e) {}
    window.__flightyMap = null;
  }
  const usedCodes = new Set();
  mapFlights.forEach(f => { usedCodes.add(f.from); usedCodes.add(f.to); });
  const pts = [...usedCodes].map(c => ({ code: c, ...airportInfo(c) })).filter(a => a.lat && a.lon);
  if (!pts.length) {
    mapEl.innerHTML = '<div class="empty-note" style="padding-top:40px;">Nessuna rotta da mostrare con questi filtri.</div>';
    return;
  }

  const map = L.map(mapEl, { scrollWheelZoom: true, zoomControl: true, attributionControl: true });
  window.__flightyMap = map;

  const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri',
    maxZoom: 19
  });
  const satLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, pane: 'shadowPane'
  });
  const darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    subdomains: 'abcd', maxZoom: 19
  });

  window.__flightyLayers = { satLayer, satLabels, darkLayer };
  if (mapStyle === 'satellite') { satLayer.addTo(map); satLabels.addTo(map); }
  else { darkLayer.addTo(map); }

  const routeSeenFlown = {};
  const routeSeenFuture = {};
  mapFlights.forEach(f => {
    const a = airportInfo(f.from), b = airportInfo(f.to);
    if (!a.lat || !b.lat) return;
    const key = [f.from, f.to].sort().join('-');
    const bucket = isFuture(f) ? routeSeenFuture : routeSeenFlown;
    bucket[key] = (bucket[key] || 0) + 1;
  });
  const FLOWN_COLOR = '#39FF8A';   // verde acceso — voli volati, ben visibile anche su satellite
  const FUTURE_COLOR = '#E8A23D'; // arancione — voli in programma
  function drawRoutes(routeSeen, color, dashed, glow) {
    Object.keys(routeSeen).forEach(key => {
      const [c1, c2] = key.split('-');
      const a = airportInfo(c1), b = airportInfo(c2);
      const weight = routeSeen[key];
      const mainWeight = Math.min(2.2 + weight * 0.8, 6);
      if (glow) {
        // alone sottostante per far risaltare la linea anche su sfondo chiaro/satellitare
        L.polyline([[a.lat, a.lon], [b.lat, b.lon]], {
          color: color, weight: mainWeight + 5, opacity: 0.22, dashArray: dashed ? '6, 6' : null
        }).addTo(map);
      }
      L.polyline([[a.lat, a.lon], [b.lat, b.lon]], {
        color: color,
        weight: mainWeight,
        opacity: Math.min(0.85 + weight * 0.05, 1),
        dashArray: dashed ? '6, 6' : null
      }).addTo(map);
    });
  }
  drawRoutes(routeSeenFlown, FLOWN_COLOR, false, true);
  drawRoutes(routeSeenFuture, FUTURE_COLOR, true, true);

  const bounds = [];
  pts.forEach(a => {
    bounds.push([a.lat, a.lon]);
    const isHome = HOME_AIRPORTS.includes(a.code);
    const count = mapFlights.filter(f => f.from === a.code || f.to === a.code).length;
    const marker = L.circleMarker([a.lat, a.lon], {
      radius: isHome ? 9 : 6.5,
      color: '#FFFFFF',
      weight: 2,
      fillColor: isHome ? '#F0755A' : FLOWN_COLOR,
      fillOpacity: 1
    }).addTo(map);
    marker.bindPopup(`<b>${a.code}</b> · ${a.city}${a.country ? ', ' + a.country : ''}<br/>${count} vol${count === 1 ? 'o' : 'i'}`);
  });

  if (bounds.length === 1) map.setView(bounds[0], 6);
  else map.fitBounds(bounds, { padding: [36, 36] });

  setTimeout(() => { try { map.invalidateSize(); } catch(e) {} }, 80);
}

function switchMapStyle(style) {

  if (style === 'satellite') { layers.satLayer.addTo(map); layers.satLabels.addTo(map); }
  else { layers.darkLayer.addTo(map); }
  const btns = root.querySelectorAll('.map-toggle button');
  btns.forEach(b => b.classList.toggle('active', b.getAttribute('data-style') === style));

function renderRankList(counts, activeVal, dim, labelFn) {
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const max = entries[0] ? entries[0][1] : 1;
  const rows = entries.map((e,i) => `
    <div class="rank-row clickable ${activeVal===e[0]?'active':''}" data-dim="${dim}" data-val="${e[0].replace(/"/g,'&quot;')}">
      <div class="rank-idx">${i+1}</div>
      <div class="rank-name">${labelFn ? labelFn(e[0]) : e[0]}</div>
      <div class="rank-bar-track"><div class="rank-bar-fill" style="width:${(e[1]/max*100).toFixed(0)}%"></div></div>
      <div class="rank-val">${e[1]}</div>
    </div>`).join('') || '<div class="empty-note">Nessun dato</div>';
  return `<div class="rank-scroll">${rows}</div>`;
}

function renderDualRankList(counts, kmTotals, activeVal, dim, sortBy, labelFn, sortDir) {
  const names = Object.keys(counts);
  const barKey = sortBy === 'km' ? (n => kmTotals[n] || 0) : (n => counts[n] || 0);
  if (sortBy === 'year') {
    names.sort((a, b) => sortDir === 'asc' ? (parseInt(a,10) - parseInt(b,10)) : (parseInt(b,10) - parseInt(a,10)));
  } else {
    names.sort((a, b) => barKey(b) - barKey(a));
  }
  const maxVal = names.length ? Math.max(...names.map(barKey)) || 1 : 1;
  const rows = names.map((name, i) => `
    <div class="rank-row clickable ${activeVal===name?'active':''}" data-dim="${dim}" data-val="${name.replace(/"/g,'&quot;')}">
      <div class="rank-idx">${i+1}</div>
      <div class="rank-name">${labelFn ? labelFn(name) : name}</div>
      <div class="rank-bar-track"><div class="rank-bar-fill" style="width:${(barKey(name)/maxVal*100).toFixed(0)}%"></div></div>
      <div class="rank-val-count${sortBy==='count'?' rank-val-primary':''}">${counts[name]}</div>
      <div class="rank-val-km${sortBy==='km'?' rank-val-primary':''}">${fmtNum(kmTotals[name]||0)} km</div>
    </div>`).join('') || '<div class="empty-note">Nessun dato</div>';
  return `<div class="rank-scroll">${rows}</div>`;
}

function applyQuickFilters(list) {
  let out = list;
  const now = new Date();
  if (currentFilter !== 'all') {
    const yearsAgo = { '1y': 1, '3y': 3 };
    if (currentFilter === 'thisyear') {
      out = out.filter(f => f.date.slice(0,4) === String(now.getFullYear()));
    } else if (currentFilter === 'work') {
      out = out.filter(f => (f.note||'').toUpperCase().includes('X LAVORO'));
    } else if (currentFilter === 'flown') {
      out = out.filter(isFlown);
    } else if (currentFilter === 'notflown') {
      out = out.filter(isFuture);
    } else if (yearsAgo[currentFilter]) {
      const cutoff = new Date(now); cutoff.setFullYear(cutoff.getFullYear() - yearsAgo[currentFilter]);
      out = out.filter(f => new Date(f.date) >= cutoff);
    }
  }
  if (searchTerm.trim()) {
    const t = searchTerm.trim().toLowerCase();
    out = out.filter(f =>
      f.company.toLowerCase().includes(t) ||
      f.from.toLowerCase().includes(t) || f.to.toLowerCase().includes(t) ||
      (f.fromCity||'').toLowerCase().includes(t) || (f.toCity||'').toLowerCase().includes(t) ||
      (f.aircraft||'').toLowerCase().includes(t)
    );
  }
  return out;
}

function renderPass(f, idx) {
  const d = new Date(f.date + 'T00:00:00');
  const day = d.getDate();
  const month = MONTHS_IT[d.getMonth()];
  const year = d.getFullYear();
  const hours = (f.km||0)/780 + 25/60;
  const h = Math.floor(hours);
  const m = Math.round((hours-h)*60);
  const future = isFuture(f);
  const tailCounts = getTailCounts();
  const isRepeatTail = f.tail && tailCounts[f.tail] > 1;
  return `
    <div class="pass${future?' pass-future':''}" data-idx="${idx}">
      <div class="pass-main">
        <div class="pass-route">

function exportBackupXlsx() {
  if (typeof XLSX === 'undefined') { alert('Libreria di esportazione non disponibile.'); return; }
  const rows = flights.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(f => ({
    'Data': f.date,
    'Compagnia': f.company,
    'Da (IATA)': f.from,

    'A (IATA)': f.to,

    'Tail Number': f.tail || '',
    'Km': f.km || '',

  }));
  const ws = XLSX.utils.json_to_sheet(rows);

// --- Importazione massiva da Excel ---
// Riconosce le stesse colonne del backup che si scarica con "Esporta backup",
// così puoi ricaricare in blocco un file preparato altrove o modificato in Excel.
function excelSerialToISO(serial) {
  const d = new Date(Math.round((serial - 25569) * 86400 * 1000));
  return d.toISOString().slice(0, 10);
}
function parseDateFlexible(value) {
  if (value instanceof Date) return value.toISOString().slice(0, 10);
  if (typeof value === 'number') return excelSerialToISO(value);
  const s = String(value).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return s;
}
function normalizeRowKeys(row) {
  const norm = {};
  Object.keys(row).forEach(k => { norm[k.trim().toLowerCase()] = row[k]; });
  return norm;
}
function pickField(norm, ...keys) {
  for (const k of keys) {
    if (norm[k] !== undefined && norm[k] !== null && String(norm[k]).trim() !== '') return norm[k];
  }
  return null;
}
function parseNumField(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = parseFloat(String(v).replace(',', '.'));
  return isNaN(n) ? null : n;
}

async function handleImportFile(e) {
  const file = e.target.files && e.target.files[0];
  e.target.value = ''; // reset per permettere di riselezionare lo stesso file
  if (!file) return;
  if (typeof XLSX === 'undefined') { alert('Libreria di importazione non disponibile.'); return; }

  let rawRows;
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    rawRows = XLSX.utils.sheet_to_json(ws, { defval: '' });
  } catch (err) {
    console.error('Errore lettura file', err);
    alert('Non sono riuscito a leggere questo file. Assicurati che sia un .xlsx valido.');
    return;
  }
  if (!rawRows.length) { alert('Il file sembra vuoto.'); return; }

  const existingKeys = new Set(flights.map(f => `${f.date}|${f.from}|${f.to}|${f.company}`));
  const toImport = [];
  const duplicates = [];
  const invalid = [];

  rawRows.forEach((row, i) => {
    const norm = normalizeRowKeys(row);
    const dateRaw = pickField(norm, 'data', 'date');
    const company = pickField(norm, 'compagnia', 'company');
    const from = pickField(norm, 'da (iata)', 'da', 'from');
    const to = pickField(norm, 'a (iata)', 'a', 'to');
    if (!dateRaw || !company || !from || !to) { invalid.push(i + 2); return; }

    const date = parseDateFlexible(dateRaw);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { invalid.push(i + 2); return; }

    const flight = {
      date,
      company: String(company).trim(),
      from: String(from).trim().toUpperCase(),
      fromCity: (pickField(norm, 'città partenza', 'citta partenza', 'fromcity') || '').toString().trim() || null,
      to: String(to).trim().toUpperCase(),
      toCity: (pickField(norm, 'città arrivo', 'citta arrivo', 'tocity') || '').toString().trim() || null,
      aircraft: (pickField(norm, 'aereo', 'aircraft') || '').toString().trim() || null,
      tail: (pickField(norm, 'tail number', 'tail') || '').toString().trim() || null,
      km: parseNumField(pickField(norm, 'km')),
      price: parseNumField(pickField(norm, 'prezzo (€)', 'prezzo', 'price')),
      note: (pickField(norm, 'note') || '').toString().trim() || null,
      extra: null
    };

    const key = `${flight.date}|${flight.from}|${flight.to}|${flight.company}`;
    if (existingKeys.has(key)) { duplicates.push(flight); return; }
    existingKeys.add(key); // evita doppioni anche all'interno dello stesso file
    toImport.push(flight);
  });

  if (!toImport.length) {
    await showInfoModal('Importazione', `<div style="text-align:center;padding:8px 0;">Nessun volo nuovo da importare.${duplicates.length?`<br/>${duplicates.length} già presenti (saltati).`:''}${invalid.length?`<br/><span style="color:var(--coral)">${invalid.length} righe con dati mancanti/non validi.</span>`:''}</div>`);
    return;
  }

  const previewHtml = toImport.slice(0, 12).map(f => `
    <div class="tail-flight-row">
      <span class="tail-flight-date">${f.date.split('-').reverse().join('/')}</span>
      <span class="tail-flight-route">${f.from} → ${f.to}</span>
      <span class="tail-flight-company">${f.company}</span>
    </div>`).join('');
  const moreNote = toImport.length > 12 ? `<div style="text-align:center;font-size:11px;color:var(--text-faint);margin-top:8px;">…e altri ${toImport.length - 12}</div>` : '';
  const skipNote = (duplicates.length || invalid.length)
    ? `<div style="font-size:11px;color:var(--text-faint);margin-top:10px;">${duplicates.length ? `${duplicates.length} già presenti (saltati). ` : ''}${invalid.length ? `${invalid.length} righe non valide (saltate).` : ''}</div>`
    : '';

  const confirmed = await showConfirmModal(
    `Importare ${toImport.length} vol${toImport.length===1?'o':'i'}?`,
    `<div class="tail-flight-list">${previewHtml}</div>${moreNote}${skipNote}`,
    'Importa'
  );
  if (!confirmed) return;

  try {
    if (supabaseClient) {
      const { data, error } = await supabaseClient.from('flights').insert(toImport.map(flightToRow)).select();
      if (error) throw error;
      (data || []).forEach(row => flights.push(rowToFlight(row)));
    } else {
      toImport.forEach(f => flights.push(f));
    }
  } catch (err) {
    console.error('Errore importazione massiva', err);
    await showInfoModal('Errore', '<div style="text-align:center;padding:8px 0;color:var(--coral)">Importazione fallita — controlla la connessione e riprova.</div>');
    return;
  }

  render();
  resolveUnknownAirports().then(changed => { if (changed) render(); });
  await showInfoModal('Importazione completata', `<div style="text-align:center;padding:8px 0;">✓ ${toImport.length} vol${toImport.length===1?'o':'i'} importat${toImport.length===1?'o':'i'} e sincronizzat${toImport.length===1?'o':'i'}</div>`);
}

  // cross-filter clicks (year bars, rank rows)

    el.addEventListener('click', () => {

      const val = el.getAttribute('data-val');

    });

  // ordinamento box "Voli per anno", "Compagnie" e "Tipologia aereo" (Voli / Km)

    btn.addEventListener('click', () => {

      const val = btn.getAttribute('data-sort');

      else if (sortDim === 'aircraft') aircraftSortBy = val;
      else if (sortDim === 'year') {
        if (val === 'year' && yearSortBy === 'year') {
          yearSortDir = yearSortDir === 'asc' ? 'desc' : 'asc';

        }

      const list = getFilteredFlights();
      const idxMap = list.map(f => flights.indexOf(f));

      bindPassEdit();
      bindTailClicks();

    });
  }

  // toggle add form (new flight)
  const toggleBtn = root.querySelector('#toggle-add');
  const exportBtn = root.querySelector('#export-backup');
  if (exportBtn) exportBtn.addEventListener('click', exportBackupXlsx);
  const importBtn = root.querySelector('#import-data');
  const importInput = root.querySelector('#import-file-input');
  if (importBtn) importBtn.addEventListener('click', triggerImportFile);
  if (importInput) importInput.addEventListener('change', handleImportFile);
  const addForm = root.querySelector('#add-form');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', async () => {
      if (!addForm.classList.contains('open')) {
        editingFlightId = null;
        resetFormFields();
        root.querySelector('#save-flight').textContent = 'Salva volo';
        root.querySelector('#form-title').textContent = 'Nuovo volo';
        const dEl = root.querySelector('#f-date');
        dEl.value = new Date().toISOString().slice(0,10);
        addForm.classList.add('open');
      } else {
        addForm.classList.remove('open');
      }
    });
  }
  const cancelBtn = root.querySelector('#cancel-add');
  if (cancelBtn) cancelBtn.addEventListener('click', () => { addForm.classList.remove('open'); editingFlightId = null; });

  // cerca il logo della compagnia appena scritta (se non già nota)
  const companyInput = root.querySelector('#f-company');
  if (companyInput) {
    companyInput.addEventListener('blur', () => {
      const name = companyInput.value.trim();
      if (name && !AIRLINE_IATA[name]) resolveAirlineCode(name);
    });
  }

  // autocompila la città quando riconosce un codice IATA (noto o cercato nel database mondiale)
  ['f-from','f-to'].forEach(fieldId => {
    const input = root.querySelector('#'+fieldId);
    const cityId = fieldId === 'f-from' ? 'f-fromcity' : 'f-tocity';
    if (!input) return;
    input.addEventListener('blur', async () => {
      const code = input.value.trim().toUpperCase();
      if (!code) return;
      const cityInput = root.querySelector('#'+cityId);
      if (AIRPORTS[code]) {
        if (cityInput && !cityInput.value.trim()) cityInput.value = AIRPORTS[code].city;
        return;
      }
      const db = await ensureAirportsDB();
      if (db[code]) {
        AIRPORTS[code] = { city: db[code].city, country: db[code].country, lat: db[code].lat, lon: db[code].lon };
        if (cityInput && !cityInput.value.trim()) cityInput.value = db[code].city;
      }
    });
  });

  // save flight (insert or update depending on editingFlightId)
  const saveBtn = root.querySelector('#save-flight');
  if (saveBtn) {
    saveBtn.addEventListener('click', async () => {
      const date = root.querySelector('#f-date').value;
      const company = root.querySelector('#f-company').value.trim();
      const from = root.querySelector('#f-from').value.trim().toUpperCase();
      const fromCity = root.querySelector('#f-fromcity').value.trim();
      const to = root.querySelector('#f-to').value.trim().toUpperCase();
      const toCity = root.querySelector('#f-tocity').value.trim();
      const aircraft = root.querySelector('#f-aircraft').value.trim();
      const tail = root.querySelector('#f-tail').value.trim();
      const kmVal = root.querySelector('#f-km').value;
      const priceVal = root.querySelector('#f-price').value;
      const note = root.querySelector('#f-note').value.trim();
      const msg = root.querySelector('#form-msg');

      if (!date || !company || !from || !to) {
        msg.textContent = 'Compila almeno data, compagnia, da e a.';
        msg.style.color = '#F0755A';
        return;
      }

      if (!AIRPORTS[from] || !AIRPORTS[to]) {
        const db = await ensureAirportsDB();
        if (!AIRPORTS[from]) {
          AIRPORTS[from] = db[from]
            ? { city: fromCity || db[from].city, country: db[from].country, lat: db[from].lat, lon: db[from].lon }
            : { city: fromCity || from, country: '', lat: null, lon: null };
        }
        if (!AIRPORTS[to]) {
          AIRPORTS[to] = db[to]
            ? { city: toCity || db[to].city, country: db[to].country, lat: db[to].lat, lon: db[to].lon }
            : { city: toCity || to, country: '', lat: null, lon: null };
        }
      }
      if (fromCity && AIRPORTS[from]) AIRPORTS[from].city = fromCity;
      if (toCity && AIRPORTS[to]) AIRPORTS[to].city = toCity;

      // preserve "extra" (legacy reimbursement field) untouched when editing — no UI for it, don't wipe it
      const existingExtra = editingFlightId ? (flights.find(f => f.id === editingFlightId) || {}).extra : null;

      const flightData = {
        date, company, from, fromCity: fromCity || AIRPORTS[from].city, to, toCity: toCity || AIRPORTS[to].city,
        aircraft: aircraft || null, tail: tail || null,
        km: kmVal ? parseFloat(kmVal) : null,
        price: priceVal ? parseFloat(priceVal) : null,
        note: note || null, extra: existingExtra ?? null
      };

      if (editingFlightId) {
        try {
          const updated = await updateFlightRemote(editingFlightId, flightData);
          const idx = flights.findIndex(f => f.id === editingFlightId);
          if (idx >= 0) flights[idx] = updated;
          msg.textContent = 'Volo aggiornato ✓ (sincronizzato)';
          msg.style.color = '#4FD8C9';
        } catch (err) {
          console.error('Errore aggiornamento remoto', err);
          const idx = flights.findIndex(f => f.id === editingFlightId);
          if (idx >= 0) flights[idx] = { ...flights[idx], ...flightData };
          msg.textContent = 'Aggiornato solo su questo dispositivo — controlla la connessione.';
          msg.style.color = '#F0755A';
        }
        editingFlightId = null;
      } else {
        try {
          const saved = await insertFlightRemote(flightData);
          flights.push(saved);
          msg.textContent = date > TODAY_STR ? 'Volo in programma salvato ✓ (sincronizzato)' : 'Volo salvato ✓ (sincronizzato)';
          msg.style.color = '#4FD8C9';
        } catch (err) {
          console.error('Errore salvataggio remoto', err);
          flights.push(flightData);
          msg.textContent = 'Salvato solo su questo dispositivo — controlla la connessione.';
          msg.style.color = '#F0755A';
        }
      }
      setTimeout(() => render(), 600);
    });
  }

  bindPassDelete();
  bindPassEdit();
  bindTailClicks();
  setTimeout(() => initLeafletMap(mapFlights), 0);
}

function resetFormFields() {
  ['f-date','f-company','f-from','f-fromcity','f-to','f-tocity','f-aircraft','f-tail','f-km','f-price','f-note'].forEach(id => {
    const el = root.querySelector('#'+id);
    if (el) el.value = '';
  });
  const msg = root.querySelector('#form-msg');
  if (msg) msg.textContent = '';
}

async function openEditForm(idx) {
  const f = flights[idx];
  if (!f) return;
  editingFlightId = f.id;
  const addForm = root.querySelector('#add-form');
  root.querySelector('#f-date').value = f.date;
  root.querySelector('#f-company').value = f.company || '';
  root.querySelector('#f-from').value = f.from || '';
  root.querySelector('#f-fromcity').value = f.fromCity || '';
  root.querySelector('#f-to').value = f.to || '';
  root.querySelector('#f-tocity').value = f.toCity || '';
  root.querySelector('#f-aircraft').value = f.aircraft || '';
  root.querySelector('#f-tail').value = f.tail || '';
  root.querySelector('#f-km').value = f.km || '';
  root.querySelector('#f-price').value = f.price || '';
  root.querySelector('#f-note').value = f.note || '';
  root.querySelector('#form-msg').textContent = '';
  root.querySelector('#save-flight').textContent = 'Salva modifiche';
  root.querySelector('#form-title').textContent = 'Modifica volo';
  addForm.classList.add('open');
  addForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function bindPassEdit() {
  root.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.getAttribute('data-edit'), 10);
      openEditForm(idx);
    });
  });
}

function bindTailClicks() {
  root.querySelectorAll('[data-tail]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const tail = el.getAttribute('data-tail');
      const related = flights.filter(f => f.tail === tail).slice().sort((a,b)=>a.date.localeCompare(b.date));
      const rowsHtml = related.map(f => `
        <div class="tail-flight-row">
          <span class="tail-flight-date">${f.date.split('-').reverse().join('/')}</span>
          <span class="tail-flight-route">${f.from} → ${f.to}</span>
          <span class="tail-flight-company">${getAirlineLogo(f.company)} ${f.company}</span>
        </div>`).join('');
      showInfoModal(`✈️ ${tail} · ${related.length} voli`, `<div class="tail-flight-list">${rowsHtml}</div>`);
    });
  });
}

function bindPassDelete() {
  root.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const idx = parseInt(btn.getAttribute('data-del'), 10);
      const target = flights[idx];
      if (!target) return;
      const confirmed = await showConfirmModal(
        'Eliminare questo volo?',
        `${target.from} → ${target.to} · ${target.date.split('-').reverse().join('/')}<br/>Questa azione non può essere annullata.`,
        'Elimina'
      );
      if (!confirmed) return;
      try {
        await deleteFlightRemote(target.id);
      } catch (err) {
        console.error('Errore eliminazione remota', err);
        alert('Non sono riuscito a eliminarlo dal database condiviso (offline?). Riprova quando sei online.');
        return;
      }
      flights.splice(idx, 1);
      render();
    });
  });
}

initAuth();


})();
</script>
